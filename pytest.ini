[tool:pytest]
# pytest 설정 파일

# 테스트 디렉토리
testpaths = tests

# 기본 옵션
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 최소 Python 버전
minversion = 6.0

# 테스트 파일 패턴
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 마커 정의
markers =
    slow: 느린 테스트 (실제 파일 I/O 포함)
    integration: 통합 테스트
    unit: 단위 테스트
    mcp: MCP 도구 테스트

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# pytest-asyncio 설정
asyncio_mode = auto 