meta:
  id: S_1_1
  title: "Invalid Hook Address Flags: 훅 주소의 권한 플래그 비트가 유효하지 않을 때 초기화 거부"
  category: "Spoofing"
  severity: "medium"
  tags: []
  author: ""
  created: ""
spec:
  description: "PoolKey의 hooks 주소가 유효하지 않은 권한 비트를 가짐 (예: 0x...FF)"
  actors:
    - id: "user"
      role: "EOA user"
      trust_level: "untrusted"
  assets:
    - name: "Hook"
      type: "address"
      critical: true
  components:
    - name: "PoolManager"
      type: "contract"
      deployed_at: ""
  trust_boundaries:
    - from: "user"
      to: "PoolManager"
      enforcement: "msg.sender check"
  data_flows:
    - source: "user"
      target: "PoolManager"
      function: "initialize"
      params:
        - name: "hook"
          value: "invalid"
  behaviors:
    - actor: "user"
      action: "calls initialize with invalid hook address"
  precondition: "PoolKey의 hooks 주소가 유효하지 않은 권한 비트를 가짐 (예: 0x...FF)"
  action: "manager.initialize(key, initialSqrtPrice)"
  expected: "vm.expectRevert(Hooks.HookAddressNotValid.selector)"

