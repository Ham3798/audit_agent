meta:
  id: S_1_2
  title: "Invalid Hook for Dynamic Fee: 동적 수수료 플래그가 설정되었으나 훅 주소가 0x0일 때 초기화 거부"
  category: "Spoofing"
  severity: "medium"
  tags: []
  author: ""
  created: ""
spec:
  description: "PoolKey의 fee가 DYNAMIC_FEE_FLAG이고 hooks가 address(0)"
  actors:
    - id: "user"
      role: "EOA user"
      trust_level: "untrusted"
  assets:
    - name: "Hook"
      type: "address"
      critical: true
  components:
    - name: "PoolManager"
      type: "contract"
      deployed_at: ""
  trust_boundaries:
    - from: "user"
      to: "PoolManager"
      enforcement: "msg.sender check"
  data_flows:
    - source: "user"
      target: "PoolManager"
      function: "initialize"
      params:
        - name: "hook"
          value: "0x0"
  behaviors:
    - actor: "user"
      action: "calls initialize with hook = address(0) and dynamic fee flag"
  precondition: "PoolKey의 fee가 DYNAMIC_FEE_FLAG이고 hooks가 address(0)"
  action: "manager.initialize(key, initialSqrtPrice)"
  expected: "vm.expectRevert(Hooks.HookAddressNotValid.selector)"
code:
  compiler_version: ""
  target_contract_name: "PoolManager"
  target_contract_declaration: "PoolManager internal _targetContract;"
  target_contract_instance_name: "_targetContract"
  required_imports:
    - 'import { PoolManager } from "src/PoolManager.sol";'
    - 'import { IPoolManager } from "src/interfaces/IPoolManager.sol";'
    - 'import { PoolKey } from "src/types/PoolKey.sol";'
    - 'import { Currency, CurrencyLibrary } from "src/types/Currency.sol";'
    - 'import { IHooks } from "src/interfaces/IHooks.sol";'
    - 'import { Hooks } from "src/libraries/Hooks.sol";'
    - 'import { LPFeeLibrary } from "src/libraries/LPFeeLibrary.sol";'
    - 'import { TestERC20 } from "src/test/TestERC20.sol";'
  setup_code: |
    TestERC20 token0 = new TestERC20(1e27);
    TestERC20 token1 = new TestERC20(1e27);
    _targetContract = new PoolManager(address(this));
  test_setup_code: |
    TestERC20 token0 = new TestERC20(1e27);
    TestERC20 token1 = new TestERC20(1e27);
    PoolKey memory key = PoolKey({
        currency0: Currency.wrap(address(token0)),
        currency1: Currency.wrap(address(token1)),
        fee: LPFeeLibrary.DYNAMIC_FEE_FLAG,
        tickSpacing: 60,
        hooks: IHooks(address(0))
    });
    uint160 initialSqrtPrice = 79228162514264337593543950336; // 1:1
  action_function: "initialize"
  action_code: "_targetContract.initialize(key, initialSqrtPrice);"
  expected_revert_selector: "Hooks.HookAddressNotValid.selector"
  assertion_code: null
  helper_contracts: []
hints: {}
prompt_ctx: {}
patches: []
runlog: []
test_insights: []
extras: {} 