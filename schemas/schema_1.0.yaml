# scenario schema v1.3.0
# 
# [핵심 아키텍처 변화: 1 시나리오 = 1 PoC + n개 유닛테스트]
# - 기존: 1 시나리오 = 1 테스트 컨트랙트 구조
# - 신규: 1 시나리오 = 1 통합 PoC 코드 + n개의 개별 유닛테스트 구조
# - 각 유닛테스트는 독립적으로 관리되며, 실행 로그와 인사이트를 별도 추적
# - 모든 유닛테스트를 결합하여 하나의 통합 PoC 코드 자동 생성 지원
#
# [새로운 섹션]
# - code: PoC 컨트랙트 코드 및 대상 컨트랙트 정보
# - unit_tests: n개의 유닛테스트 정의 (배열)
# - runlog/test_insights: test_name 필드 추가로 테스트별 추적
#
# [기존 호환성]
# - 기존 스키마 구조와 완전 호환
# - test_code_snapshots 필드 유지 (기존 호환성)
# - 새로운 필드들은 선택적으로 처리

schema_version: "scenario-schema-1.0"

###############################################################################
# L0. META – 고정 식별자
###############################################################################
meta:
  id          : ""                        # e.g. "S-1.1"
  title       : ""                        # 시나리오 요약
  category    : ""                        # 예: "Spoofing"
  severity    : ""                        # 예: "critical"
  tags        : []                        # 예: [ hooks, pool ]
  author      : ""                        # 작성자
  created     : ""                        # ISO8601: "YYYY-MM-DDTHH:MM:SS+TZ"

###############################################################################
# L1. SPEC – 위협 모델링 기반 구조화 시나리오
###############################################################################
spec:
  description: ""                           # 시나리오 개요 (자연어)

  actors:
    - id: "user"
      role: "EOA user"
      trust_level: "untrusted"

  assets:
    - name: "Hook"
      type: "address"
      
  components:
    - name: "PoolManager"
      type: "contract"
      deployed_at: "0x..."

  trust_boundaries:
    - from: "user"
      to: "PoolManager"
      enforcement: "msg.sender check"

  data_flows:
    - source: "user"
      target: "PoolManager"
      function: "initialize"
      params:
        - name: "hook"
          value: "0x0"

  behaviors:
    - actor: "user"
      action: "calls initialize with invalid hook address"

  precondition: >
    The PoolManager has not yet been initialized.
    The provided hook address is not whitelisted.

  action: >
    User calls initialize(hook = address(0x0)).

  expected: >
    Transaction must revert with `HookAddressNotValid` selector.

###############################################################################
# L1.5. CODE – PoC 코드 및 유닛테스트 정의
###############################################################################
code:
  poc_contract: ""                        # PoC 컨트랙트 코드 (Solidity)
  target_contract_name: ""                # 대상 컨트랙트 이름
  deployment_script: ""                   # 배포 스크립트 (선택적)

unit_tests:
  - test_name: ""                         # 테스트 함수 이름 (예: "test_InvalidHookRevert")
    description: ""                       # 테스트 설명
    test_code: ""                         # 테스트 함수 코드 (Solidity)
    expected_behavior: ""                 # 예상 동작
    tags: []                              # 테스트 태그 (예: ["revert", "security"])

###############################################################################
# L2. HINTS – 컴파일러/정적 분석/런타임 힌트
###############################################################################
hints:
  compiler:
    errors        : []                   # solc 에러 메시지 리스트
    warnings      : []                   # solc 경고 메시지 리스트 (실제로는 errors에 포함될 수 있음)

  runtime:
    last_run_id     : ""                 # runlog[-1].run_id
    revert_info     : ""                 # 실제 Revert 메시지 (문자열 또는 첫번째 Revert 라인)
    decoded_logs    : []                 # console.log 또는 이벤트 메시지
  gas:
    used     : 0                         # 마지막 실행 gas

###############################################################################
# L3. PATCHES – 코드/계획 수정 이력 (append-only)
###############################################################################
patches:
  - ts      : ""                       # ISO8601 timestamp
    author  : ""                       # "forge-runner" or human
    reason  : ""                       # 오류 원인 또는 요청
    diff    : |                        # json-patch 또는 @@ field @@ 형태
      ""

###############################################################################
# L4. RUNLOG – 실행 결과 (append-only)
###############################################################################
runlog:
  - run_id            : ""             # 고유 ID
    ts                : ""             # ISO8601
    test_name         : ""             # 실행된 테스트 이름 (unit_tests의 test_name과 매칭)
    status            : ""             # "success"/"failure"/"error"
    diff              : ""             # 실행 내용 또는 변경 사항 요약
    stdout            : ""             # 표준 출력 (제한된 크기)
    stderr            : ""             # 표준 에러 (제한된 크기)

###############################################################################
# L5. TEST_INSIGHTS – LLM 기반 테스트 분석 인사이트 (append-only)
###############################################################################
test_insights:
  - run_id            : ""             # 원본 테스트 실행 ID
    ts                : ""             # ISO8601
    test_name         : ""             # 분석된 테스트 이름
    precondition      : ""             # 테스트의 전제 조건
    state_changes     : ""             # 관찰된 상태 변화
    patterns          : ""             # 감지된 패턴
    security_implications: ""         # 보안 영향
    additional_info   : ""             # 추가 분석 정보 및 대안 가설
    confidence        : 0.0            # 인사이트 신뢰도 (0.0 ~ 1.0)

###############################################################################
# L6. TEST_CODE_SNAPSHOTS – 테스트 코드 스냅샷 (기존 호환성 유지)
###############################################################################
test_code_snapshots: {}                 # 컨트랙트명: 코드 매핑 (기존 호환성)
